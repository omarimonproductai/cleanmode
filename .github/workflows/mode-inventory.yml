name: MODE inventory

# Execució manual: genera l'inventari de reports/queries de MODE i committeja
# els resultats (output/) de tornada a la branca.
on:
  workflow_dispatch:
    inputs:
      workspace:
        description: "Nom del workspace de MODE (app.mode.com/<workspace>/...)"
        required: true
        default: "ecooltra706"
      debug:
        description: "Mode diagnòstic: bolca l'estructura crua de /spaces i surt"
        type: boolean
        default: false
      collections:
        description: "Tokens de col·leccions (separats per comes) a recórrer directament"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run inventory
        env:
          MODE_WORKSPACE: ${{ inputs.workspace }}
          MODE_API_TOKEN: ${{ secrets.MODE_API_TOKEN }}
          # El secret del repo es diu MODE_SECRET; config.py l'accepta com a àlies.
          MODE_API_SECRET: ${{ secrets.MODE_SECRET }}
          MODE_COLLECTIONS: ${{ inputs.collections }}
        run: |
          python -m mode_cleanup.main --output-dir output \
            --collections "$MODE_COLLECTIONS" \
            ${{ inputs.debug && '--debug-dump' || '' }}

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --staged --quiet; then
            echo "Sense canvis a output/."
            exit 0
          fi
          git commit -m "Update MODE inventory output"
          # Reintents amb rebase per evitar carreres amb altres pushos.
          # En cas de conflicte, guanya la sortida generada pel runner (-X theirs).
          for i in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase -X theirs "origin/${GITHUB_REF_NAME}" || git rebase --abort
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Push OK"; exit 0
            fi
            echo "Push rebutjat, reintent $i..."; sleep 3
          done
          echo "No s'ha pogut fer push després de diversos intents"; exit 1
